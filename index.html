    const translations = {
        en: { title: "JuvanE-shopBD", subtitle: "🎮 EVERYTHING YOU CAN GET FROM US 🎮", trust: "🛡️ 100% SECURE & TRUSTED - GLOBAL SERVERS 🛡️", labelName: "Full Name:", placeholderName: "Enter your full name", labelPhone: "WhatsApp Number:", placeholderPhone: "1XXXXXXXXX", labelProduct: "Select Service or Product:", optDefault: "-- Select Product --", labelDetails: "Player UID / In-Game Name:", placeholderDetails: "Enter Player UID or Character Name", btnSubmit: "Complete Order", processing: "Processing..." },

    };

    let currentLang = 'en';

    function switchLanguage(l) {
        currentLang = l;
        const t = translations[l];
        document.getElementById('title').innerText = t.title;
        document.getElementById('subtitle').innerText = t.subtitle;
        document.getElementById('trust-badge').innerText = t.trust;
        document.getElementById('label-name').innerText = t.labelName;
        document.getElementById('name').placeholder = t.placeholderName;
        document.getElementById('label-phone').innerText = t.labelPhone;
        document.getElementById('phone').placeholder = t.placeholderPhone;
        document.getElementById('label-product').innerText = t.labelProduct;
        document.getElementById('opt-default').innerText = t.optDefault;
        document.getElementById('label-details').innerText = t.labelDetails;
        document.getElementById('details').placeholder = t.placeholderDetails;
        document.getElementById('btn-submit').innerText = t.btnSubmit;
    }

    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        var btn = document.getElementById('btn-submit');
        btn.disabled = true;
        btn.innerText = translations[currentLang].processing;

        var name = document.getElementById('name').value;
        var code = document.getElementById('countryCode').value;
        var phone = document.getElementById('phone').value;
        var fullPhone = code + " " + phone;
        var product = document.getElementById('product').value;
        var details = document.getElementById('details').value;
        var whatsappNumber = "8801617965512";

        var formData = new FormData();
        formData.append('Name', name);
        formData.append('Phone', fullPhone);
        formData.append('Product', product);
        formData.append('Player UID/Name', details);

        fetch("https://formspree.io/f/xqpklzvj", {
            method: "POST",
            body: formData,
            headers: { 'Accept': 'application/json' }
        }).catch(function(error) {
            console.log("Background email error:", error);
        });

        var waMessage = "🛒 *NEW ORDER - JuvanE-shopBD*%0A%0A" + 
                        "*Name:* " + encodeURIComponent(name) + "%0A" + 
                        "*Phone:* " + encodeURIComponent(fullPhone) + "%0A" + 
                        "*Product:* " + encodeURIComponent(product) + "%0A" + 
                        "*UID/Name:* " + encodeURIComponent(details);

        var waUrl = "https://wa.me/" + whatsappNumber + "?text=" + waMessage;

        setTimeout(function() {
            window.location.href = waUrl;
        }, 400);
    });
